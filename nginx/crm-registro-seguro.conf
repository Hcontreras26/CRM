# Registro de nginx SIN las llaves del MCP de Claude (#193, épica #191).
#
# La URL personal del MCP lleva la llave dentro (`/api/mcp/u/crm_mcp_…`), y
# nginx la escribía entera en access.log. La aplicación ya la tapa en sus
# propios registros (`urlPersonal` en mcp.auth.js y la ruta OAuth en
# mcp.oauth.js); nginx no. Quien leyera access.log podía conectarse a Claude
# como esa persona.
#
# La llave aparece en tres peticiones, y las tres quedan tapadas:
#   POST /crm/api/mcp/u/crm_mcp_…                                    (la URL personal)
#   GET  /.well-known/oauth-protected-resource/crm/api/mcp/u/crm_mcp_… (OAuth, #207)
#   GET  /crm/api/mcp/oauth/authorize?…&resource=…%2Fu%2Fcrm_mcp_…     (OAuth, codificada)
# Y en el Referer, por si una página de esas enlaza a otra.
#
# Se tapa, no se deja de registrar: la línea sigue sirviendo para saber quién
# llamó, cuándo y con qué resultado. Solo cambia la llave por `crm_mcp_***`.
#
# ─── CÓMO SE APLICA (lo hace Diego; Diana no tiene acceso al servidor) ──────
#
#   1. Este fichero va en el contexto `http` (map y log_format no valen dentro
#      de un `server`). En Debian/Ubuntu, conf.d/ ya se incluye ahí:
#        sudo cp nginx/crm-registro-seguro.conf /etc/nginx/conf.d/crm-registro-seguro.conf
#
#   2. En el `server` de 360crm.tech (sirve a /crm y a /testeo), cambiar la línea
#      access_log para que use este formato:
#        access_log /var/log/nginx/access.log crm_seguro;
#      Si no hay ninguna línea access_log en ese server, añadirla. Si hay otros
#      server que pasen por /api/mcp, lo mismo en cada uno.
#
#   3. Comprobar y recargar. `nginx -t` antes, siempre:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Probar (debe salir crm_mcp_*** y NO la llave):
#        curl -s -o /dev/null -X POST https://360crm.tech/testeo/api/mcp/u/crm_mcp_PRUEBAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#        sudo tail -n 1 /var/log/nginx/access.log
#
#   Probado el 03/10 con nginx 1.27 en Docker delante del CRM local: la llave no
#   queda en access.log y el MCP sigue recibiéndola entera (la máscara solo
#   afecta a lo que se escribe, no a lo que se reenvía).
#
# ─── LO QUE ESTO NO TAPA ────────────────────────────────────────────────────
#
#   error.log: cuando nginx anota un error de una petición (p. ej. un 502 porque
#   la API está caída) escribe `request: "POST /crm/api/mcp/u/crm_mcp_…"` y ese
#   texto no se puede cambiar con log_format. Solo pasa con errores de nginx, no
#   en el uso normal. Se limpia con el mismo comando que los registros viejos
#   (docs/mcp-limpiar-registros-nginx.md).

# La línea de la petición, con la llave tapada. Dos pasadas: una URL normal
# lleva la llave una vez, pero así tampoco se escapa una petición que la lleve
# dos veces (en la ruta y en `resource=`).
map $request $crm_request_1 {
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $request;
}
map $crm_request_1 $crm_request_seguro {
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $crm_request_1;
}

# El Referer, igual. Vacío se escribe «-», como en `combined`.
map $http_referer $crm_referer_seguro {
    ""                                                     "-";
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $http_referer;
}

# El formato `combined` de siempre, con las dos variables tapadas. Mismas
# columnas y mismo orden: lo que ya lea access.log (goaccess, fail2ban, grep)
# sigue funcionando.
log_format crm_seguro '$remote_addr - $remote_user [$time_local] '
                      '"$crm_request_seguro" $status $body_bytes_sent '
                      '"$crm_referer_seguro" "$http_user_agent"';
